<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#46178f" />
  <title>Host — Quiz Offline</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">

    <!-- ============ EDITOR ============ -->
    <section id="view-editor">
      <div class="brand"><h1>Creează jocul</h1></div>
      <div class="card wide">
        <label for="game-title">Titlul jocului</label>
        <input type="text" id="game-title" placeholder="Ex: Test la Istorie" maxlength="120" />

        <div id="questions-list"></div>

        <div class="btn-row">
          <button class="btn secondary" id="btn-add-q">➕ Adaugă întrebare</button>
        </div>

        <hr style="border:none;border-top:1px solid #eee;margin:18px 0" />
        <p class="error-msg" id="editor-error"></p>
        <div class="btn-row">
          <button class="btn ok" id="btn-create">🚀 Creează joc &amp; obține PIN</button>
        </div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn secondary small" id="btn-save">💾 Salvează local</button>
          <button class="btn secondary small" id="btn-load">📂 Încarcă salvat</button>
          <button class="btn secondary small" id="btn-clear">🗑️ Golește</button>
          <button class="btn secondary small" id="btn-sample">✨ Exemplu</button>
        </div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn secondary small" id="btn-import">⬆️ Importă fișier JSON</button>
          <button class="btn secondary small" id="btn-export">⬇️ Exportă fișier JSON</button>
          <input type="file" id="import-file" accept="application/json,.json" class="hidden" />
        </div>
      </div>
      <footer class="hint"><a href="/">← Înapoi</a></footer>
    </section>

    <!-- ============ LOBBY ============ -->
    <section id="view-lobby" class="hidden">
      <div class="brand"><h1 id="lobby-title">Lobby</h1></div>
      <div class="center">
        <div class="join-info">
          <p>Intră pe: <code id="join-url">...</code></p>
          <p style="margin:6px 0">PIN joc:</p>
          <div class="pin-badge" id="pin-badge">------</div>
        </div>
        <div class="qr-box"><canvas id="qr"></canvas></div>
        <p class="join-info muted" style="opacity:.85">Scanează codul sau tastează adresa în browser.</p>

        <div class="counter"><span id="player-count">0</span> jucători conectați</div>
        <div class="players-grid" id="players-grid"></div>

        <div class="btn-row" style="max-width:460px;margin-top:10px">
          <button class="btn ok" id="btn-start" disabled>▶️ Începe jocul</button>
        </div>
      </div>
    </section>

    <!-- ============ QUESTION (presenter) ============ -->
    <section id="view-question" class="hidden">
      <div class="q-head">
        <span class="q-count">Întrebarea <span id="q-index">1</span>/<span id="q-total">1</span></span>
        <div class="timer" id="q-timer">0</div>
      </div>
      <div class="q-text" id="q-text">...</div>
      <img id="q-media" class="q-media hidden" alt="" />
      <div class="progress"><div id="q-progress" style="width:100%"></div></div>
      <div class="answered-count"><span id="answered">0</span> / <span id="answered-total">0</span> au răspuns</div>
      <div class="answers" id="q-answers"></div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn secondary small" id="btn-pause">⏸️ Pauză</button>
        <button class="btn secondary small" id="btn-skip">⏭️ Sari peste timp</button>
        <button class="btn danger small" id="btn-end">⏹️ Termină jocul</button>
      </div>
    </section>

    <!-- ============ REVEAL / LEADERBOARD ============ -->
    <section id="view-reveal" class="hidden">
      <div class="brand"><h1>Rezultate</h1></div>
      <div class="card wide">
        <h3 id="reveal-q"></h3>
        <div class="dist" id="dist"></div>
        <p class="muted" id="reveal-summary"></p>
        <h3 style="margin-top:18px">🏆 Clasament</h3>
        <div class="leaderboard" id="leaderboard"></div>
        <div class="btn-row" style="margin-top:16px">
          <button class="btn ok" id="btn-next">▶️ Următoarea</button>
          <button class="btn danger small" id="btn-end2">⏹️ Termină</button>
        </div>
      </div>
    </section>

    <!-- ============ END / PODIUM ============ -->
    <section id="view-end" class="hidden">
      <div class="brand"><h1>🎉 Final de joc!</h1></div>
      <div class="center">
        <div class="podium" id="podium"></div>
        <div class="card wide">
          <h3>Statistici complete</h3>
          <div class="leaderboard" id="full-stats"></div>
          <div class="btn-row" style="margin-top:16px">
            <button class="btn" id="btn-again">🔁 Joc nou</button>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/vendor/qrcode.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
