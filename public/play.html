<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#46178f" />
  <title>Joacă — Quiz Offline</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">

    <!-- ===== JOIN ===== -->
    <section id="view-join">
      <div class="brand"><h1>Intră în joc</h1></div>
      <div class="center">
        <div class="card">
          <label for="pin">PIN-ul jocului</label>
          <input type="text" id="pin" class="pin-input" inputmode="numeric" maxlength="6" placeholder="000000" />
          <label for="name">Numele tău</label>
          <input type="text" id="name" maxlength="20" placeholder="Ex: Andrei" />
          <p class="error-msg" id="join-error"></p>
          <button class="btn ok" id="btn-join">Intră</button>
        </div>
      </div>
      <footer class="hint"><a href="/">← Înapoi</a></footer>
    </section>

    <!-- ===== LOBBY (waiting) ===== -->
    <section id="view-wait" class="hidden">
      <div class="center">
        <div class="spinner"></div>
        <h2 style="color:#fff">Bun venit, <span id="my-name"></span>!</h2>
        <p class="status-pill">Așteaptă startul jocului...</p>
      </div>
    </section>

    <!-- ===== QUESTION (answer pad) ===== -->
    <section id="view-answer" class="hidden">
      <div class="q-head">
        <span class="q-count">Întrebarea <span id="p-index">1</span>/<span id="p-total">1</span></span>
        <div class="timer" id="p-timer">0</div>
      </div>
      <div class="q-text" id="p-qtext" style="font-size:1.1rem"></div>
      <div class="answers pad" id="p-answers"></div>
      <p class="answered-count hidden" id="p-locked">Răspuns trimis ✔ Așteaptă...</p>
    </section>

    <!-- ===== RESULT splash ===== -->
    <section id="view-result" class="hidden">
      <div class="center">
        <div class="splash" id="result-splash">
          <h2 id="result-title"></h2>
          <p class="pts" id="result-points"></p>
          <p id="result-rank"></p>
        </div>
        <p class="status-pill">Așteaptă următoarea întrebare...</p>
      </div>
    </section>

    <!-- ===== END ===== -->
    <section id="view-final" class="hidden">
      <div class="center">
        <div class="brand"><h1 id="final-emoji">🎉</h1></div>
        <div class="card">
          <h2 id="final-place"></h2>
          <p class="pts" style="font-size:1.6rem;text-align:center;color:#26890c" id="final-score"></p>
          <p class="muted" id="final-correct" style="text-align:center"></p>
          <div id="final-podium" class="leaderboard" style="margin-top:14px"></div>
          <button class="btn" id="btn-replay" style="margin-top:14px">Ieși</button>
        </div>
      </div>
    </section>

    <!-- ===== KICKED / disconnected ===== -->
    <section id="view-kicked" class="hidden">
      <div class="center">
        <div class="card">
          <h2 id="kicked-msg">Ai fost deconectat.</h2>
          <button class="btn" onclick="location.reload()">Reîncearcă</button>
        </div>
      </div>
    </section>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/play.js"></script>
</body>
</html>
